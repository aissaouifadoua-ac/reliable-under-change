[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tef"
version = "1.0.0"
description = "Trustworthy Energy Forecasting: drift-aware, calibrated, explainable forecasting harness"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Deep (torch) tests are isolated into their own process by scripts/run_tests.sh
# because torch + lightgbm co-loaded in one process segfault on macOS (duplicate
# libomp). Default `pytest` skips them so the core suite stays green.
addopts = "-q --ignore=tests/test_patchtst.py"
